name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'SETUP.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Android project (web app + native widget/alarms)
        run: npm run android:prepare

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/owlf.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: owlf-apk
          path: dist/owlf.apk

      - name: Publish to Releases (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: OWLF APK (latest build)
          body: |
            Latest build of the OWLF Android app.
            Open this page on your phone, tap owlf.apk under Assets, then install.
          files: dist/owlf.apk
          make_latest: true
